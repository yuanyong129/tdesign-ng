<div
  [class]="boxClasses()"
  (mouseenter)="handleMouseenter($event)"
  (mouseleave)="handleMouseleave($event)"
  (click)="handleClick($event)"
>
  <div class="t-range-input__inner">
    @if (prefixIcon(); as icon) {
      <div class="t-range-input__prefix">
        <ng-container *ngTemplateOutlet="icon" />
      </div>
    }
    @if (label()) {
      <div class="t-range-input__prefix">
        <ng-container *ngTemplateOutlet="richText; context: { $implicit: label() }" />
      </div>
    }

    <div class="t-input__wrap t-range-input__inner-left">
      <div [class]="fieldClasses(0)">
        <input
          class="t-input__inner"
          type="text"
          autocomplete="off"
          [value]="displayTexts()[0]"
          [placeholder]="placeholders()[0]"
          [disabled]="disabledFields()[0]"
          [readOnly]="readonly()"
          (input)="handleInput(0, $event)"
          (focus)="handleFocus(0, $event)"
          (blur)="handleBlur(0, $event)"
          (keydown)="handleKeydown(0, $event)"
        />
      </div>
    </div>

    <div class="t-range-input__inner-separator">
      <ng-container *ngTemplateOutlet="richText; context: { $implicit: separator() }" />
    </div>

    <div class="t-input__wrap t-range-input__inner-right">
      <div [class]="fieldClasses(1)">
        <input
          class="t-input__inner"
          type="text"
          autocomplete="off"
          [value]="displayTexts()[1]"
          [placeholder]="placeholders()[1]"
          [disabled]="disabledFields()[1]"
          [readOnly]="readonly()"
          (input)="handleInput(1, $event)"
          (focus)="handleFocus(1, $event)"
          (blur)="handleBlur(1, $event)"
          (keydown)="handleKeydown(1, $event)"
        />
      </div>
    </div>

    @if (suffix()) {
      <div class="t-range-input__suffix">
        <ng-container *ngTemplateOutlet="richText; context: { $implicit: suffix() }" />
      </div>
    }

    @if (showClearIcon()) {
      <span class="t-range-input__suffix t-range-input__suffix-icon">
        <svg
          class="t-icon t-icon-close-circle-filled t-range-input__suffix-clear"
          viewBox="0 0 24 24"
          width="1em"
          height="1em"
          aria-hidden="true"
          (click)="handleClear($event)"
        >
          <path
            fill="currentColor"
            d="M12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23ZM8.81753 7.40346L11.9999 10.5858L15.1815 7.40414L16.5957 8.81835L13.4141 12L16.5957 15.1816L15.1815 16.5958L11.9999 13.4142L8.81753 16.5965L7.40332 15.1823L10.5856 12L7.40332 8.81767L8.81753 7.40346Z"
          />
        </svg>
      </span>
    } @else {
      @if (suffixIcon(); as icon) {
        <span class="t-range-input__suffix t-range-input__suffix-icon">
          <ng-container *ngTemplateOutlet="icon" />
        </span>
      }
    }
  </div>
</div>

@if (tips()) {
  <div [class]="tipsClasses()">
    <ng-container *ngTemplateOutlet="richText; context: { $implicit: tips() }" />
  </div>
}

<ng-template #richText let-value>
  @if (asTemplate(value); as template) {
    <ng-container *ngTemplateOutlet="template" />
  } @else {
    {{ value }}
  }
</ng-template>
