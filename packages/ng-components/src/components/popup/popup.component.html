@if (triggerTemplate(); as template) {
  <span #customTrigger style="display:contents"><ng-container [ngTemplateOutlet]="template" /></span>
} @else if (!externalTrigger()) {
  <ng-content />
}

<ng-template #overlayTemplate>
  <div
    [class]="popupClasses()"
    [ngStyle]="rootStyle()"
    [attr.data-popper-placement]="popperPlacement()"
    [style.z-index]="zIndex() ?? null"
    (click)="handleOverlayClick($event)"
  >
    <div [class]="contentClasses()" [ngStyle]="innerStyle()" (scroll)="handleScroll($event)">
      @if (content()) {
        {{ content() }}
      }
      <ng-content select="[tPopupContent]" />
      @if (showArrow()) {
        <div class="t-popup__arrow"></div>
      }
    </div>
  </div>
</ng-template>
