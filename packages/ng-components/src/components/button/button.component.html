@if (isLink()) {
  <a
    [class]="classes()"
    [attr.href]="href() ?? null"
    [attr.aria-disabled]="mergedDisabled() || null"
    [attr.tabindex]="mergedDisabled() ? -1 : null"
    (click)="handleClick($event)"
  >
    <ng-container [ngTemplateOutlet]="inner" />
  </a>
} @else if (tag() === 'div') {
  <div [class]="classes()" [attr.aria-disabled]="mergedDisabled() || null" (click)="handleClick($event)">
    <ng-container [ngTemplateOutlet]="inner" />
  </div>
} @else {
  <button
    [class]="classes()"
    [attr.type]="type()"
    [attr.form]="form() ?? null"
    [disabled]="mergedDisabled()"
    (click)="handleClick($event)"
  >
    <ng-container [ngTemplateOutlet]="inner" />
  </button>
}

<ng-template #inner>
  @if (loading()) {
    <t-loading [loading]="loading()" [text]="loadingProps()?.text" [size]="loadingProps()?.size ?? 'medium'"
      [inheritColor]="loadingProps()?.inheritColor ?? true" [delay]="loadingProps()?.delay ?? 0"
      [fullscreen]="loadingProps()?.fullscreen ?? false" [showOverlay]="loadingProps()?.showOverlay ?? true"
      [preventScrollThrough]="loadingProps()?.preventScrollThrough ?? true" [zIndex]="loadingProps()?.zIndex" />
  } @else {
    <ng-content select="[tButtonIcon]" />
  }
  <span class="t-button__text"><ng-content select=":not([tButtonIcon]):not([tButtonSuffix])" /></span>
  <span class="t-button__suffix"><ng-content select="[tButtonSuffix]" /></span>
</ng-template>
