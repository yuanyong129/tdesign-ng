<div [class]="classes()" [style]="customStyle()">
  <ng-content select="[tTagIcon]" />
  <span #text [class]="textClasses()" [style]="textStyle()" [attr.title]="titleAttr()">
    @if (content()) {
      {{ content() }}
    }
    <ng-content />
  </span>
  @if (closable() && !disabled()) {
    <svg
      class="t-icon t-tag__icon-close"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      width="1em"
      height="1em"
      aria-hidden="true"
      (click)="handleClose($event)"
    >
      <path
        fill="none"
        stroke="currentColor"
        stroke-linecap="square"
        stroke-width="2"
        d="M16.9503 7.05029L12.0005 12M12.0005 12L7.05078 16.9498M12.0005 12L16.9503 16.9498M12.0005 12L7.05078 7.05029"
      />
    </svg>
  }
</div>
