<div class="t-input__wrap">
  @if (label()) {
    <label class="t-input__label" [attr.for]="innerId">{{ label() }}</label>
  }
  <div [class]="classes()">
    <span class="t-input__prefix">
      <ng-content select="[tInputPrefixIcon]" />
    </span>
    <input
      #inner
      class="t-input__inner"
      [id]="innerId"
      [attr.type]="type()"
      [attr.name]="name()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxlengthValue()"
      [attr.spellcheck]="spellCheck()"
      [attr.autofocus]="autofocus() ? '' : null"
      [value]="text()"
      [placeholder]="placeholder() ?? ''"
      [disabled]="mergedDisabled()"
      [readOnly]="readonly()"
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"
      (keydown)="handleKeydown($event)"
      (keyup)="handleKeyup($event)"
    />
    <span class="t-input__suffix">
      @if (canClear()) {
        <svg
          class="t-icon t-icon-close-circle-filled t-input__suffix-clear"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="1em"
          height="1em"
          aria-hidden="true"
          (click)="handleClear($event)"
        >
          <path
            fill="currentColor"
            d="M12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23ZM8.81753 7.40346L11.9999 10.5858L15.1815 7.40414L16.5957 8.81835L13.4141 12L16.5957 15.1816L15.1815 16.5958L11.9999 13.4142L8.81753 16.5965L7.40332 15.1823L10.5856 12L7.40332 8.81767L8.81753 7.40346Z"
          />
        </svg>
      }
      <ng-content select="[tInputSuffixIcon], [tInputSuffix]" />
    </span>
  </div>
  @if (tips()) {
    <div [class]="tipsClasses()">{{ tips() }}</div>
  } @else if (showLimit()) {
    <div class="t-input__tips t-input__limit-number">{{ limitText() }}</div>
  }
</div>
