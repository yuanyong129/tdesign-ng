<span class="t-switch__handle">
  @if (loading()) {
    <span class="t-loading">
      <svg class="t-loading__gradient t-icon-loading" viewBox="0 0 12 12" width="1em" height="1em">
        <foreignObject x="0" y="0" width="12" height="12">
          <div class="t-loading__gradient-conic"></div>
        </foreignObject>
      </svg>
    </span>
  }
</span>
<div class="t-switch__content">
  {{ labelText() }}
  <ng-content />
</div>
