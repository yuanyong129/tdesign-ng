<label [class]="classes()" [attr.title]="title()">
  <input
    #former
    type="checkbox"
    class="t-checkbox__former"
    [attr.name]="name()"
    [checked]="isChecked()"
    [indeterminate]="isIndeterminate()"
    [disabled]="isDisabled()"
    [attr.aria-checked]="isIndeterminate() ? 'mixed' : isChecked()"
    (click)="handleClick($event)"
    (change)="handleChange($event)"
  />
  <span class="t-checkbox__input">
    @if (isIndeterminate()) {
      <svg class="t-icon t-icon-minus" viewBox="0 0 24 24" width="1em" height="1em" fill="none" aria-hidden="true">
        <path d="M16.502 12L7.50195 12" stroke="currentColor" stroke-linecap="square" stroke-width="2" fill="none" />
      </svg>
    } @else {
      <svg class="t-icon t-icon-check" viewBox="0 0 24 24" width="1em" height="1em" fill="none" aria-hidden="true">
        <path
          d="M19.5708 7.37842L10.3785 16.5708L5.42871 11.6211"
          stroke="currentColor"
          stroke-linecap="square"
          stroke-width="2"
          fill="none"
        />
      </svg>
    }
  </span>
  <span class="t-checkbox__label"
    >{{ label() }}<ng-content
  /></span>
</label>
