name: Release

# 发布只从 Actions 页面手动触发（workflow_dispatch）。
#
# 为什么不用「推 v* tag 就发布」：tag 现在是纯粹的版本标记，发 npm 的动作
# 要么本地 `pnpm run release`，要么在这里点一次；两件事分开，就不会出现
# 「推个 tag 顺手把包发了」或者「tag 推了但没配 NPM_TOKEN 直接红」的意外。
# 打完 tag 再推也不会触发任何发布。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练（打包 + 校验，不 publish）'
        type: boolean
        default: true

concurrency:
  # 固定分组：两次手动触发不会并发跑，后一次排队等前一次结束。
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # npm provenance 需要 OIDC token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由根 package.json 的 packageManager 字段决定，pnpm/action-setup 会读它。
      # 必须在 setup-node 之前，否则 setup-node 的 cache: pnpm 找不到 pnpm 可执行文件。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打印待发布版本
        run: |
          VERSION=$(node -p "require('./packages/ng-components/package.json').version")
          echo "待发布版本：$VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "::warning::tag v$VERSION 已存在——该版本应该已经发过，脚本会自动跳过已存在的版本"
          fi

      - name: 构建并校验产物
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm run release:check
          else
            pnpm run release
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
